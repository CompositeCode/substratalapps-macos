# Builds the macOS installer (.pkg) and publishes it as a GitHub Release asset.
#
# Trigger: push a version tag (git tag v0.2.0 && git push origin v0.2.0), or
# run it by hand with a version. The tag's number becomes the app's version;
# the run number becomes its build number.
#
# Signing is optional, so the pipeline works before the Apple prerequisites
# exist (docs/PREREQUISITES.md → Signing and distribution):
#   - With the Developer ID secrets below, the .pkg is signed, notarized and
#     stapled, and the release is a normal release.
#   - Without them, the .pkg is unsigned (the app is ad-hoc signed) and the
#     release is marked pre-release, for internal testing only.
#
# Secrets (repository settings → Secrets and variables → Actions):
#   DEVELOPER_ID_APP_P12, DEVELOPER_ID_INSTALLER_P12   base64 of each exported .p12
#   DEVELOPER_ID_P12_PASSWORD                          the .p12s' password
#   NOTARY_KEY_P8                                      base64 of the App Store Connect API key (.p8)
#   NOTARY_KEY_ID, NOTARY_ISSUER_ID                    that key's ID and issuer ID
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v (for example 0.2.0)
        required: true

permissions:
  contents: write # create the release and upload the .pkg

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pkg:
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Normalize the version
        run: |
          v="${VERSION#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$VERSION' isn't a version like 0.2.0"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import signing certificates
        id: certs
        env:
          APP_P12: ${{ secrets.DEVELOPER_ID_APP_P12 }}
          INSTALLER_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$APP_P12" ] || [ -z "$INSTALLER_P12" ]; then
            echo "::warning::Developer ID certificates aren't configured; building an unsigned .pkg for testing."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          for name in APP INSTALLER; do
            var="${name}_P12"
            echo "${!var}" | base64 --decode > "$RUNNER_TEMP/$name.p12"
            security import "$RUNNER_TEMP/$name.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
            rm "$RUNNER_TEMP/$name.p12"
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          app_id=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          installer_id=$(security find-identity -v "$keychain" | sed -n 's/.*"\(Developer ID Installer: .*\)"/\1/p' | head -1)
          [ -n "$app_id" ] && [ -n "$installer_id" ] || { echo "::error::Couldn't find both Developer ID identities in the imported certificates"; exit 1; }
          echo "APP_IDENTITY=$app_id" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$installer_id" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Set up notarization
        if: steps.certs.outputs.signed == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [ -z "$NOTARY_KEY_P8" ]; then
            echo "::warning::NOTARY_KEY_P8 isn't configured; the .pkg will be signed but not notarized."
            exit 0
          fi
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build the .pkg
        id: build
        run: |
          pkg=$(scripts/build-pkg.sh | tail -1)
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"

      - name: Keep the archive log if the build failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-log
          path: build/pkg/archive.log
          if-no-files-found: ignore

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PKG: ${{ steps.build.outputs.pkg }}
          SIGNED: ${{ steps.certs.outputs.signed }}
        run: |
          tag="v$VERSION"
          notes=$(awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v || $2 == "Unreleased") found = 1; next }
            found { print }' CHANGELOG.md)
          if [ "$SIGNED" != "true" ]; then
            notes=$(printf '> **Unsigned test build.** Not signed with Developer ID or notarized. To open it, right-click the .pkg and choose Open, or allow it in System Settings → Privacy & Security.\n\n%s' "$notes")
            prerelease=--prerelease
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$PKG" "$PKG.sha256" --clobber
          else
            gh release create "$tag" "$PKG" "$PKG.sha256" --title "Substratal Hub $VERSION" --notes "$notes" ${prerelease:-} \
              $([ "${{ github.event_name }}" = workflow_dispatch ] && echo --target "$GITHUB_SHA")
          fi

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
