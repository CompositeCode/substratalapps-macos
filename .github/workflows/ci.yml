# Every push and pull request: the shared package's tests, an app build, and a
# check that every Help link the app opens exists in a fresh build of the
# shared Hub help center, so a change that breaks the app or a help link can't
# reach main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: SubstratalKit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/cache@v4
        with:
          path: Packages/SubstratalKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/SubstratalKit/Package.resolved', 'Packages/SubstratalKit/Sources/SubstratalAPI/openapi.yaml') }}
      - name: Test
        working-directory: Packages/SubstratalKit
        run: swift test

  app:
    name: Build the macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project SubstratalHub.xcodeproj -scheme SubstratalHub \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build

  help-links:
    name: Help links resolve in the Hub help center
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: CompositeCode/substratalapps-applications-specs
          path: _specs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build the help center
        working-directory: _specs
        run: npm ci && npm run build
      - name: Check every screen page and Help menu link
        run: ruby scripts/help-check.rb _specs/_site/help
