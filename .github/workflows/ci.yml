# Every push and pull request: the shared package's tests, an app build, and a
# full Help Center build with its link check, so a change that breaks the app
# or leaves a help page behind can't reach main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: SubstratalKit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/cache@v4
        with:
          path: Packages/SubstratalKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/SubstratalKit/Package.resolved', 'Packages/SubstratalKit/Sources/SubstratalAPI/openapi.yaml') }}
      - name: Test
        working-directory: Packages/SubstratalKit
        run: swift test

  app:
    name: Build the macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project SubstratalHub.xcodeproj -scheme SubstratalHub \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build

  help:
    name: Build and check the Help Center
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: help
      - name: Generate app-derived pages
        run: ruby scripts/help-generate.rb --commit "$GITHUB_SHA"
      - name: Build
        working-directory: help
        run: bundle exec jekyll build --destination _site
      - name: Check every app help link and internal link
        run: ruby scripts/help-check.rb help/_site
