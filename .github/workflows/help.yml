# Versioned build and deploy of the Help Center to GitHub Pages.
#
# Runs on every push to main that changes the app or its docs: the screen
# catalog, the screens that are built, the vendored openapi.yaml, the changelog
# or the help pages. Each run publishes a new docs version (patch by default;
# put [docs:minor] or [docs:major] in a commit subject since the last version
# to bump further). Its frozen snapshot is committed to the help-versions
# branch (never to main) and served at /versions/<version>/, labelled with the
# app version and Platform API version it describes.
# Same scheme as the API repository's docs.yml.
name: Help Center

on:
  push:
    branches: [main]
    paths:
      - "App/**"
      - "Packages/SubstratalKit/Sources/**"
      - "help/**"
      - "scripts/help-*.rb"
      - "CHANGELOG.md"
      - "project.yml"
      - ".github/workflows/help.yml"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for this release
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write # push snapshots to help-versions
  pages: write
  id-token: write

# One release at a time, never cancelled midway: each run reads the archive the
# previous run wrote.
concurrency:
  group: help-pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out version archive
        run: |
          if git ls-remote --exit-code --heads origin help-versions >/dev/null; then
            git fetch --depth=1 origin +help-versions:refs/remotes/origin/help-versions
            git worktree add _archive -B help-versions origin/help-versions
          else
            echo "No help-versions branch yet; starting the archive at 1.0.0."
            git worktree add --orphan -b help-versions _archive
          fi

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: help

      - name: Pick version bump
        id: bump
        env:
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          bump="${INPUT_BUMP:-patch}"
          last=$(ruby -ryaml -e 'm = File.exist?("_archive/manifest.yml") ? YAML.load_file("_archive/manifest.yml") : nil
            v = ((m || {})["versions"] || []).first
            print v ? v["commit"].to_s : ""')
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null; then
            msgs=$(git log --format=%s "$last..HEAD")
          else
            msgs=$(git log -1 --format=%s)
          fi
          if grep -q '\[docs:major\]' <<<"$msgs"; then bump=major
          elif [ "$bump" != major ] && grep -q '\[docs:minor\]' <<<"$msgs"; then bump=minor; fi
          echo "level=$bump" >> "$GITHUB_OUTPUT"

      - name: Build versioned site
        id: build
        run: |
          ruby scripts/help-build.rb \
            --archive _archive \
            --out _site \
            --bump "${{ steps.bump.outputs.level }}" \
            --commit "$GITHUB_SHA" \
            --summary "$(git log -1 --format=%s)"

      - name: Commit snapshot to help-versions
        working-directory: _archive
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          if [ ! -f README.md ]; then
            cat > README.md <<'EOF'
          # help-versions

          Archive of every published version of the Help Center, written by
          `.github/workflows/help.yml` on `main`. Don't edit by hand.

          - `manifest.yml`: every version, newest first, with the app and API version each describes.
          - `<version>/`: that version's frozen static build, served at /versions/<version>/.
          EOF
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Archive help v$VERSION from ${GITHUB_SHA::7}"
          git push origin help-versions

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
