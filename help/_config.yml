title: Substratal Hub Help
description: >-
  How to use Substratal Hub, the app for running the Substratal Apps platform
  (people, access, roles, Applications, API keys, webhooks and the audit log),
  and how to build against the Platform API it uses.

# GitHub Pages project site for this repository. If the Help Center moves to a
# custom domain (help.substratalapps.com), change both, add a CNAME, and update
# SubstratalHelpBaseURL in project.yml so the app's Help links follow.
url: "https://compositecode.github.io"
baseurl: "/substratalapps-macos"

permalink: pretty

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

color_scheme: substratal
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  button: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "API specification": "https://compositecode.github.io/substratalapps.com/"
  "GitHub": "https://github.com/CompositeCode/substratalapps-macos"
aux_links_new_tab: true

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: red
  macos:
    title: On macOS
    color: grey-dk

footer_content: >-
  Substratal Hub Help. Generated from the app's own screen catalog and the
  Platform API's openapi.yaml on every change to the app; see Versions for
  every published version.

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - _screen-notes
